[pytest]
testpaths = tests
pythonpath = .

# Coverage is scoped to the modules CI can actually exercise. The voice I/O
# modules (wake word, mic capture, TTS) need audio hardware, so they are left
# out of the gate rather than dragging a meaningless number down.
#
# The gate is 100% *within that scope*: every module here is small, and the
# lines most worth testing are the error paths (dead cache, dead database,
# malformed model output), which is exactly what a lower bar lets you skip.
# Adding a module to the scope means committing to testing it.
addopts =
    --cov=cloud
    --cov=local.normalizer
    --cov=local.decision
    --cov=local.cloud_client
    --cov-fail-under=100
